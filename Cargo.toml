[package]
name = "riso"
version = "0.1.0"
edition = "2024"
description = "Remote Interface for SSH Operations"
default-run = "riso"

# A single binary target; the frontend is chosen with cargo features:
#   riso-gui:  cargo build --release --no-default-features --features gui
#   riso-tui:  cargo build --release --no-default-features --features tui
# (shortcuts: `cargo gui` / `cargo tui`, see .cargo/config.toml).
# The packages install target/release/riso as /usr/bin/riso-gui or /usr/bin/riso-tui.
[[bin]]
name = "riso"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:adw", "dep:gtk", "dep:vte4"]
tui = ["dep:ratatui", "dep:vt100", "dep:unicode-width"]

[dependencies]
# Shared
async-channel = "2.5.0"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# riso-gui only
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"], optional = true }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"], optional = true }
vte4 = { version = "0.10", optional = true }

# riso-tui only
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"], optional = true }
vt100 = { version = "0.16", optional = true }
unicode-width = { version = "0.2", optional = true }
